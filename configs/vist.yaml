# VIST, trained from random initialization (paper Secs. 3-4).
#
#   L = 0.05 L_vel + 0.10 L_MR + 0.05 L_rel                      (Eq. 4)
#
# Replace the /path/to/... entries, or render a machine-specific copy with
# scripts/render_config.py (the train/eval wrappers do this for you).

data:
  train:
    class_path: vist.data.acappella.AcapellaDataset
    init_kwargs:
      framerate: 25
      audiorate: 16384
      n: 1
      musdb_path: /path/to/musdb_accomp/train
      audioset_path: /path/to/audioset_split/train
      data_path: /path/to/acappella/splits/train
      is_train: true
      interference_prob: 1.0          # an interfering singer in every mixture
      identity_shuffle_prob: 0.5      # swap target/interferer with their landmarks
      exclude_same_stem_interferer: true
      target_rms_range: [0.06, 0.14]
      global_gain_db_range: [-6.0, 3.0]
  val:                                # seen-singer validation, for checkpoint selection
    class_path: vist.data.acappella.AcapellaDataset
    init_kwargs:
      framerate: 25
      audiorate: 16384
      n: 1
      musdb_path: /path/to/musdb_accomp/valid
      audioset_path: /path/to/audioset_split/val
      data_path: /path/to/acappella/splits/val_seen
      is_train: false
      interference_prob: 1.0
      identity_shuffle_prob: 0.0
      deterministic: true
      seed: 1234
      target_rms_range: [0.10, 0.10]
      global_gain_db_range: [0.0, 0.0]

# Band-split audio encoder and ST-GCN over 68 facial landmarks.
backbone:
  local_feature_cfg:
    sample_rate: 16384
    n_fft: 1022
    hop_length: 256
    downsample_coarse: true
    video_temporal_features: 256
    n: 1
  freeze: false

# FiLM fusion of audio and visual tokens.
model:
  cond_dim: 512
  audio_condition_dropout: 0.2
  visual_token_dropout: 0.10          # zero 10% of visual frames; L_rel learns to detect them
  visual_token_noise_std: 0.02

stft:
  n_fft: 1024
  hop_length: 256
  win_length: 1024
  center: true

# Four-level TFC-TDF U-Net, 60/120/180/240 channels, two blocks per level.
head:
  model_channels: 60
  channel_mult: [1, 2, 3, 4]
  blocks_per_level: 2
  embedding_dim: 384
  time_dim: 128
  input_freq_bins: 513
  norm_groups: 16
  tdf_bottleneck_factor: 16
  dropout: 0.0
  temporal_num_heads: 4
  visual_reliability_floor: 0.25      # r in [0.25, 1]
  exact_resample: true
  residual_scale: unit

# Mixture-anchored target paths (Secs. 3.2-3.3).
transport:
  inference_state_ratio: 0.50         # share of each batch at (n, t) = (0, 0)
  noise_scale: 0.10                   # std of n relative to the mixture RMS
  time_sampling: logit_normal
  logit_mu: -0.4
  logit_sigma: 1.0
  max_t: 0.95
  ramp_steps: 16000                   # noise level and t ramp up from zero
  loss_eps: 1.0e-07
  db_floor: -20.0                     # clip of L_vel, Eq. (6)
  db_ceiling: 30.0
  num_steps: 1                        # network evaluations at inference

training:
  out_dir: runs/vist
  seed: 1234
  device: cuda
  batch_size: 2
  grad_accum_steps: 4                 # effective batch size 8
  num_workers: 4
  epochs: 100
  lr: 3.0e-05
  min_lr: 1.0e-06
  warmup_steps: 12000
  warmup_start_factor: 0.05
  weight_decay: 0.0001
  grad_clip: 1.0
  amp: bf16

  lambda_vel: 0.05
  lambda_mrstft: 0.10
  lambda_rel: 0.05

  log_every: 100
  val_every: 4000
  save_every: 4000
  val_batches: null
  val_batch_size: 2
  val_num_workers: 0
  val_num_steps: 1
  save_best: true
  best_metric: val_si_sdr
  best_mode: max
  ema_decay: 0.999
  ema_eval: true
  save_ema_best: true
  save_ema_last: true
  progress: false
  val_progress: false
